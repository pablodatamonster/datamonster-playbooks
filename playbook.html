<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%226%22 fill=%22%23e8353a%22/%3E%3Ctext x=%2216%22 y=%2223%22 font-size=%2219%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22Georgia%22 font-weight=%22bold%22%3EP%3C/text%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Playbook · DataMonster Playbooks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
</head>
<body>
<header class="site">
  <div class="wrap">
    <a class="brand" href="./">DataMonster <span>Playbooks</span></a>
    <nav><a href="./">All playbooks</a><a id="src" href="https://github.com/pablodatamonster/datamonster-playbooks">View on GitHub</a></nav>
  </div>
</header>

<main class="wrap"><article id="doc" class="doc">Loading…</article></main>

<footer class="site"><div class="wrap">By <a href="https://data.monster">Pablo Gomez</a> · DataMonster · Shared under <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a></div></footer>

<script>
const REPO = 'https://github.com/pablodatamonster/datamonster-playbooks/blob/main/';
const file = new URLSearchParams(location.search).get('p') || '';
const doc = document.getElementById('doc');

// Only Markdown files inside this repo, no paths that climb out of it.
if (!/^[a-z0-9_\-\/]+\.md$/i.test(file) || file.includes('..')) {
  doc.textContent = 'Playbook not found.';
} else {
  const dir = file.includes('/') ? file.slice(0, file.lastIndexOf('/') + 1) : '';
  document.getElementById('src').href = REPO + file;

  // GitHub-style heading ids, so "Contents" links keep working.
  const slug = t => t.toLowerCase().replace(/<[^>]+>/g, '').replace(/[^\w\s-]/g, '').trim().replace(/\s/g, '-');
  const renderer = {
    heading(text, level) { return `<h${level} id="${slug(text)}">${text}</h${level}>`; },
    code(code, lang) {
      if (lang === 'mermaid') return `<pre class="mermaid">${code.replace(/</g, '&lt;')}</pre>`;
      const esc = code.replace(/&/g, '&amp;').replace(/</g, '&lt;');
      return `<pre><code class="lang-${lang || ''}">${esc}</code></pre>`;
    },
    image(href, title, text) {
      // Images next to a playbook load from its folder.
      if (href && !/^(https?:|data:)/.test(href)) href = dir + href;
      return `<img class="figure" src="${href}" alt="${text || ''}">`;
    },
    link(href, title, text) {
      // Relative links to scripts and other files open on GitHub; other playbooks open here.
      if (href && !/^(https?:|#|mailto:)/.test(href)) {
        href = href.endsWith('.md') ? 'playbook.html?p=' + encodeURIComponent(dir + href) : REPO + dir + href;
      }
      const ext = /^https?:/.test(href) && !href.startsWith(location.origin);
      return `<a href="${href}"${ext ? ' rel="noopener"' : ''}>${text}</a>`;
    }
  };
  marked.use({ renderer, gfm: true });

  fetch(file).then(r => { if (!r.ok) throw new Error(); return r.text(); }).then(md => {
    doc.innerHTML = marked.parse(md);
    const h1 = doc.querySelector('h1');
    if (h1) document.title = h1.textContent + ' · DataMonster Playbooks';
    // Task-list boxes are for reading here, not ticking.
    doc.querySelectorAll('input[type=checkbox]').forEach(c => c.disabled = true);
    mermaid.initialize({ startOnLoad: false, theme: 'neutral', fontFamily: 'Poppins, sans-serif' });
    return mermaid.run({ querySelector: '.mermaid' });
  }).then(() => {
    if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView();
  }).catch(() => { doc.textContent = 'This playbook could not be loaded.'; });
}
</script>
</body>
</html>
