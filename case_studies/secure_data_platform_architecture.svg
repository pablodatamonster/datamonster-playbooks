<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" font-family="Poppins, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Architecture of the data platform</title>
  <desc id="d">Data ingestion goes to a secure upload page with sign-in and checks. Rejected files go back with a reason and are logged. Accepted files go to a cloud data warehouse with raw, staging and marts layers, which feeds dashboards and an AI connector (MCP) for plain-English questions.</desc>
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#1d1d1f" flood-opacity="0.08"/>
    </filter>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#9aa0a6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#e8353a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Connectors -->
  <path d="M212 180 H286" stroke="#9aa0a6" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <path d="M502 195 H586" stroke="#9aa0a6" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <text x="544" y="183" text-anchor="middle" font-size="13" font-weight="600" fill="#5f6368">Accepted</text>
  <path d="M832 170 C 866 170, 866 110, 896 110" stroke="#9aa0a6" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <path d="M832 220 C 866 220, 866 300, 896 300" stroke="#9aa0a6" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <path d="M395 272 V330 H110 V276" stroke="#e8353a" stroke-width="2" stroke-dasharray="6 6" fill="none" marker-end="url(#ahr)"/>
  <rect x="140" y="337" width="226" height="28" rx="14" fill="#ffffff"/>
  <text x="253" y="356" text-anchor="middle" font-size="13" font-weight="600" fill="#e8353a">Rejected: reason shown and logged</text>

  <!-- 01 Ingest -->
  <rect x="10" y="110" width="200" height="160" rx="14" fill="#1d1d1f" filter="url(#sh)"/>
  <circle cx="44" cy="146" r="20" fill="#e8353a"/>
  <path d="M44 136 V152 M37 146 L44 153 L51 146 M35 157 H53" stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="26" y="192" font-size="12" font-weight="600" letter-spacing="1.5" fill="#e8353a">01 · INGEST</text>
  <text x="26" y="218" font-size="20" font-weight="700" fill="#ffffff">Data ingestion</text>
  <text x="26" y="242" font-size="14" fill="#c9c9cc">Files from several</text>
  <text x="26" y="260" font-size="14" fill="#c9c9cc">organisations</text>

  <!-- 02 Check -->
  <rect x="290" y="110" width="210" height="160" rx="14" fill="#ffffff" stroke="#e8353a" stroke-width="2" filter="url(#sh)"/>
  <circle cx="324" cy="146" r="20" fill="#fdecec"/>
  <path d="M324 134 L334 138 V146 C334 152 330 156 324 158 C318 156 314 152 314 146 V138 Z M319 146 L323 150 L329 143" stroke="#e8353a" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="306" y="192" font-size="12" font-weight="600" letter-spacing="1.5" fill="#e8353a">02 · CHECK</text>
  <text x="306" y="218" font-size="20" font-weight="700" fill="#1d1d1f">Upload page</text>
  <text x="306" y="242" font-size="14" fill="#5f6368">Secure sign-in and</text>
  <text x="306" y="260" font-size="14" fill="#5f6368">checks on arrival</text>

  <!-- 03 Store and model -->
  <rect x="590" y="95" width="240" height="200" rx="14" fill="#e8353a" filter="url(#sh)"/>
  <circle cx="624" cy="131" r="20" fill="#ffffff" fill-opacity="0.2"/>
  <g stroke="#ffffff" stroke-width="2" fill="none">
    <ellipse cx="624" cy="123" rx="9" ry="3.5"/>
    <path d="M615 123 V139 C615 141 619 142.5 624 142.5 C629 142.5 633 141 633 139 V123"/>
    <path d="M615 131 C615 133 619 134.5 624 134.5 C629 134.5 633 133 633 131"/>
  </g>
  <text x="606" y="177" font-size="12" font-weight="600" letter-spacing="1.5" fill="#ffffff" fill-opacity="0.85">03 · STORE AND MODEL</text>
  <text x="606" y="203" font-size="20" font-weight="700" fill="#ffffff">Data warehouse</text>
  <text x="606" y="226" font-size="14" fill="#ffffff" fill-opacity="0.9">Tested measures, least access</text>
  <g font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">
    <rect x="606" y="244" width="64" height="28" rx="14" fill="#ffffff" fill-opacity="0.18"/>
    <text x="638" y="263">raw</text>
    <rect x="678" y="244" width="70" height="28" rx="14" fill="#ffffff" fill-opacity="0.18"/>
    <text x="713" y="263">staging</text>
    <rect x="756" y="244" width="62" height="28" rx="14" fill="#ffffff" fill-opacity="0.18"/>
    <text x="787" y="263">marts</text>
  </g>

  <!-- 04 See -->
  <rect x="900" y="30" width="290" height="160" rx="14" fill="#f6f6f7" stroke="#e6e6e8" filter="url(#sh)"/>
  <circle cx="934" cy="66" r="20" fill="#ffffff"/>
  <path d="M925 76 V70 M931 76 V62 M937 76 V66 M943 76 V57" stroke="#e8353a" stroke-width="3" stroke-linecap="round"/>
  <text x="916" y="112" font-size="12" font-weight="600" letter-spacing="1.5" fill="#e8353a">04 · SEE</text>
  <text x="916" y="138" font-size="20" font-weight="700" fill="#1d1d1f">Dashboards</text>
  <text x="916" y="162" font-size="14" fill="#5f6368">Own figures against the</text>
  <text x="916" y="180" font-size="14" fill="#5f6368">anonymous benchmark</text>

  <!-- 05 Ask -->
  <rect x="900" y="220" width="290" height="160" rx="14" fill="#f6f6f7" stroke="#e6e6e8" filter="url(#sh)"/>
  <circle cx="934" cy="256" r="20" fill="#ffffff"/>
  <path d="M924 249 C924 246 926 244 929 244 H939 C942 244 944 246 944 249 V257 C944 260 942 262 939 262 H932 L927 267 V262 C925 262 924 260 924 257 Z" stroke="#e8353a" stroke-width="2" fill="none" stroke-linejoin="round"/>
  <text x="916" y="302" font-size="12" font-weight="600" letter-spacing="1.5" fill="#e8353a">05 · ASK</text>
  <text x="916" y="328" font-size="20" font-weight="700" fill="#1d1d1f">AI connector (MCP)</text>
  <text x="916" y="352" font-size="14" fill="#5f6368">Plain-English questions from</text>
  <text x="916" y="370" font-size="14" fill="#5f6368">the user's own AI assistant</text>
</svg>
