# Scheduled dbt build against prod (starter for the playbook
# "GitHub Actions: run dbt on a schedule").
#
# Copy to .github/workflows/ in the client's repo. Rebuilds and tests the dbt
# project once a month and whenever someone presses "Run workflow" on the
# Actions tab. Signs in to Snowflake as a key-pair service user. Every Snowflake
# setting comes from GitHub Actions secrets; nothing secret is in this file.
#
# Expects: the dbt project in dbt/, pinned versions in dbt/requirements.txt and
# the CI profile dbt/profiles.ci.yml (starter next to this file).

name: dbt scheduled build (prod)

on:
  schedule:
    # 06:17 UTC on the 10th of every month. GitHub reads cron in UTC only.
    # The odd minute avoids the busy top of the hour. Pick a day after the data arrives.
    - cron: "17 6 10 * *"
  workflow_dispatch:            # the "Run workflow" button
    inputs:
      alert_test:
        description: "Alert test: fail on purpose before Snowflake, to check the failure email arrives"
        type: boolean
        default: false

permissions:
  contents: read                # the workflow only reads the repo

concurrency:
  group: dbt-prod               # never two builds of prod at once
  cancel-in-progress: false

jobs:
  dbt-build:
    name: dbt build --target prod
    runs-on: ubuntu-latest
    timeout-minutes: 30         # stop anything stuck before it costs much
    defaults:
      run:
        working-directory: dbt
    env:
      # Job-level env may use the secrets and github contexts, NOT runner:
      # a runner.* value here makes GitHub reject the whole file.
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
      DBT_ENV_SECRET_SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
      DBT_QUERY_TAG: dbt_client_pilot_gha_${{ github.run_number }}
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"

    steps:
      - name: Alert test (only when ticked; nothing reaches Snowflake)
        if: ${{ inputs.alert_test }}
        working-directory: .
        run: |
          echo "::error::Alert test: this run fails on purpose. GitHub should now email the account that pressed Run workflow."
          exit 1

      - name: Get the repo
        uses: actions/checkout@v4

      - name: Install Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: dbt/requirements.txt

      - name: Install dbt (versions from dbt/requirements.txt)
        run: pip install -r requirements.txt

      - name: Check the six secrets are set (values are never printed)
        run: |
          missing=0
          for name in SNOWFLAKE_ACCOUNT SNOWFLAKE_USER SNOWFLAKE_ROLE SNOWFLAKE_WAREHOUSE SNOWFLAKE_DATABASE DBT_ENV_SECRET_SNOWFLAKE_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then echo "::error::Secret for $name is empty or missing"; missing=1; fi
          done
          exit $missing

      - name: Put the CI profile in place
        # The runner's temporary folder is only known inside a step, so the
        # folder is set here and passed on to the later steps through GITHUB_ENV.
        run: |
          profiles_dir="$RUNNER_TEMP/dbt_profiles"
          mkdir -p "$profiles_dir"
          cp profiles.ci.yml "$profiles_dir/profiles.yml"
          echo "DBT_PROFILES_DIR=$profiles_dir" >> "$GITHUB_ENV"

      - name: dbt debug (sign in to Snowflake)
        run: dbt debug --target prod

      - name: dbt build (every model and test)
        run: dbt build --target prod

      - name: Write the summary
        if: ${{ always() && !inputs.alert_test }}
        run: |
          python - <<'EOF'
          import json, os, collections
          path = "target/run_results.json"
          out = open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8")
          if not os.path.exists(path):
              out.write("## dbt build: no results\n\ndbt stopped before building anything. See the dbt debug step.\n")
              raise SystemExit
          r = json.load(open(path, encoding="utf-8"))
          counts = collections.Counter(x["status"] for x in r["results"])
          failed = [x for x in r["results"] if x["status"] in ("error", "fail")]
          out.write(f"## dbt build --target prod: {'passed' if not failed else 'FAILED'}\n\n")
          out.write("| Result | Count |\n| --- | --- |\n")
          for k, v in sorted(counts.items()):
              out.write(f"| {k} | {v} |\n")
          out.write(f"\nTime: {r['elapsed_time']:.0f} seconds. Query tag in Snowflake: `{os.environ['DBT_QUERY_TAG']}`\n")
          if failed:
              out.write("\n### What failed\n\n")
              for x in failed:
                  msg = (x.get("message") or "").replace("\n", " ")[:300]
                  out.write(f"- `{x['unique_id']}`: {msg}\n")
          EOF

      - name: Keep the dbt results for 30 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-results-${{ github.run_number }}
          path: |
            dbt/target/run_results.json
            dbt/logs/dbt.log
          retention-days: 30
          if-no-files-found: ignore
